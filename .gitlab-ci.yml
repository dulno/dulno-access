stages:
  - test
  - build
  - scan
  - publish
  - deploy
  - merge

variables:
  DOCKER_IMAGE: "dulno-core-access"
  DOCKER_DOCS_IMAGE: "dulno-core-access-docs"

include:
  - project: 'dulno/dulno-template'
    file: '/core/core-template.yml'

build_jar:
  stage: build
  image: gradle:8.14.3-jdk21
  script:
    - gradle jar
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 day

publish_gradle:
  stage: publish
  image: gradle:8.14.3-jdk21
  dependencies: []
  script:
    - gradle publish