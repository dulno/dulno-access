name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Modules depend on com.dulno:core, which is not published to a public registry
      - uses: actions/checkout@v5
        with:
          repository: dulno/dulno-core
          path: .core
      - run: ./gradlew publishToMavenLocal
        working-directory: .core
      - run: ./gradlew build
